<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>boochslut</title>
  <meta name="description" content="boochslut is small-batch kombucha, brewed on Twin Peaks with premium green and oolong tea.">
  <meta property="og:title" content="boochslut · booch that gets around">
  <meta property="og:description" content="Small-batch kombucha, brewed on Twin Peaks with premium green and oolong tea.">
  <meta property="og:image" content="https://boochslut.com/img/bottles.jpg">
  <meta name="theme-color" content="#9da68e">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/kqp5vxe.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* The sage is the real label color, so it stays in light and dark mode. */
    :root {
      --label: #9da68e;
      --ink: #0f1412;
      --line: rgba(15, 20, 18, .9);
      /* IvyMode is the label typeface (Adobe Fonts kit kqp5vxe, light 200 only). */
      --ivy: "ivymode", "Didot", "Bodoni 72", Georgia, serif;
      --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--label);
      color: var(--ink);
      font-family: var(--display);
      font-size: 18px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    img { display: block; max-width: 100%; }

    .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 720px) { .wrap { padding: 0 32px; } }

    .mono {
      font-family: var(--mono);
      font-size: .78rem;
      letter-spacing: .02em;
      line-height: 1.5;
    }

    /* ---------- Name ---------- */

    .name {
      padding-top: 14px;
      border-bottom: 1.5px solid var(--line);
      overflow: hidden;
    }

    .wordmark {
      margin: 0;
      font-family: var(--ivy);
      font-weight: 200;
      font-size: 24vw; /* fitWordmark() fine-tunes this to the exact width */
      line-height: .92;
      letter-spacing: -0.02em;
      white-space: nowrap;
      display: inline-block;
      padding-bottom: .05em;
    }

    /* ---------- Intro ---------- */

    .intro {
      display: grid;
      gap: 24px;
      padding-top: 20px;
      padding-bottom: 64px;
    }

    .intro h1 {
      margin: 0;
      font-family: var(--ivy);
      font-weight: 200;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .photo {
      margin: 0 -16px;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 65% 70%;
    }

    .copy p {
      margin: 0 0 1em;
      max-width: 24em;
      font-family: var(--mono);
      font-size: clamp(1rem, 1.8vw, 1.15rem);
      line-height: 1.55;
    }

    @media (min-width: 900px) {
      .intro {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 32px;
        padding-top: 24px;
        padding-bottom: 120px;
        align-items: start;
      }
      .intro h1 { grid-column: 1; }
      .photo { grid-column: 2 / 4; grid-row: 1 / 3; margin: 0; aspect-ratio: 5 / 4; }
      .copy { grid-column: 1; grid-row: 2; align-self: end; }
    }

    /* ---------- The line ---------- */

    .line {
      border-top: 1.5px solid var(--line);
      padding-top: 18px;
      padding-bottom: 72px;
    }

    .line p {
      margin: 0;
      font-family: var(--ivy);
      font-weight: 200;
      font-size: clamp(3.4rem, 12vw, 10rem);
      line-height: .92;
      letter-spacing: -0.025em;
    }

    @media (min-width: 900px) { .line { padding-bottom: 120px; } }

    /* ---------- Signup ---------- */

    .signup {
      border-top: 1.5px solid var(--line);
      padding-top: 18px;
      padding-bottom: 80px;
      display: grid;
      gap: 28px;
    }

    @media (min-width: 900px) {
      .signup { grid-template-columns: 1fr 2fr; gap: 32px; padding-bottom: 120px; }
    }

    .signup h2 {
      margin: 0;
      font-family: var(--ivy);
      font-weight: 200;
      font-size: clamp(2.2rem, 4.6vw, 3.2rem);
      line-height: 1;
      letter-spacing: -0.01em;
      max-width: 9em;
    }

    form { display: grid; gap: 22px; }
    .row { display: grid; gap: 22px; }
    @media (min-width: 560px) { .row { grid-template-columns: 1fr 1fr; } }

    label { display: grid; gap: 2px; }

    input[type=text], input[type=email] {
      width: 100%;
      padding: 6px 0 10px;
      border: 0;
      border-bottom: 1.5px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: 200 1.7rem/1.2 var(--ivy);
      letter-spacing: 0;
    }

    input:focus { outline: none; border-bottom-width: 3px; padding-bottom: 8.5px; }

    button {
      justify-self: start;
      padding: 14px 28px;
      border: 0;
      border-radius: 0;
      background: var(--ink);
      color: var(--label);
      font: 600 1rem var(--display);
      letter-spacing: .02em;
      cursor: pointer;
    }

    button:hover { background: #000; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    button[disabled] { opacity: .6; cursor: progress; }

    .status { margin: 0; min-height: 1.5em; }
    .status.error { font-weight: 500; }

    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>

  <header class="wrap name">
    <p class="wordmark">boochslut</p>
  </header>

  <main>
    <section class="wrap intro">
      <h1>booch that gets around</h1>
      <figure class="photo" style="margin-block:0">
        <img src="img/bottles.jpg" alt="A bottle of boochslut Bloomdrunk kombucha in front of a four-pack carrier" fetchpriority="high">
      </figure>
      <div class="copy">
        <p>boochslut is small-batch kombucha, brewed on Twin Peaks with premium green and oolong tea</p>
        <p>Infused with florals, herbs, and succulent fruit to seduce your palate</p>
      </div>
    </section>

    <section class="wrap line">
      <p>Give into desire, be a boochslut</p>
    </section>

    <section class="wrap signup" id="join">
      <h2>join for the latest booch drops</h2>

      <form id="signup" novalidate>
        <div class="row">
          <label><span class="mono">First Name</span>
            <input type="text" name="firstName" autocomplete="given-name" required>
          </label>
          <label><span class="mono">Last Name</span>
            <input type="text" name="lastName" autocomplete="family-name" required>
          </label>
        </div>
        <label><span class="mono">Email</span>
          <input type="email" name="email" autocomplete="email" inputmode="email" required>
        </label>
        <div class="hp" aria-hidden="true">
          <input type="text" name="website" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit">Send</button>
        <p class="status mono" id="status" role="status"></p>
      </form>
    </section>
  </main>

  <script>
    // Make "boochslut" run exactly edge to edge at any screen width.
    function fitWordmark() {
      const el = document.querySelector(".wordmark");
      const target = el.parentElement.clientWidth -
        parseFloat(getComputedStyle(el.parentElement).paddingLeft) * 2;
      el.style.fontSize = "100px";
      el.style.fontSize = (100 * target / el.getBoundingClientRect().width) + "px";
    }
    document.fonts.ready.then(fitWordmark);
    addEventListener("resize", fitWordmark);

    // Google Apps Script web app URL that stores signups in a Google Sheet.
    // Leave empty to test the page without saving anything.
    const SIGNUP_URL = "https://script.google.com/macros/s/AKfycbxnXeqPlyhc8R4BnMd-qyhbSMcAC-3Z0iBuS3n5M0l6xSEt4s_b2oGII2msucgTpDuU/exec";

    const form = document.getElementById("signup");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.className = "status mono";
      status.textContent = "";

      const data = Object.fromEntries(new FormData(form));
      for (const name of ["firstName", "lastName", "email"]) {
        const input = form.elements[name];
        if (!input.value.trim() || !input.checkValidity()) {
          status.className = "status mono error";
          status.textContent = name === "email" ? "Please enter a valid email." : "Please add your first and last name.";
          input.focus();
          return;
        }
      }

      button.disabled = true;
      button.textContent = "Sending…";
      try {
        if (SIGNUP_URL) {
          // text/plain avoids a CORS preflight, which Apps Script can't answer.
          const res = await fetch(SIGNUP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data)
          });
          const result = await res.json();
          if (!result.ok) throw new Error(result.error || "Something went wrong.");
        } else if (location.hostname === "localhost") {
          await new Promise((r) => setTimeout(r, 400));
        } else {
          throw new Error("Signups aren't connected yet.");
        }
        form.reset();
        status.textContent = "Thanks! You're on the list.";
      } catch (err) {
        status.className = "status mono error";
        status.textContent = SIGNUP_URL ? "That didn't go through. Please try again." : err.message;
      } finally {
        button.disabled = false;
        button.textContent = "Send";
      }
    });
  </script>
</body>
</html>
